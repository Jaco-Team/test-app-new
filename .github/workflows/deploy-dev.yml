name: Build and Deploy dev.jacofood.ru

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write


env:
  IMAGE_NAME: ghcr.io/jaco-team/test-app-new


jobs:

  # =========================================================
  # BUILD
  # =========================================================

  build:

    name: Build Docker image

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and push frontend image
        uses: docker/build-push-action@v6

        with:

          context: .

          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          build-args: |
            NEXT_PUBLIC_SITE_API_BASE_URL=https://api2.jacochef.ru/site/public/index.php/

            NEXT_PUBLIC_CAFE_REVIEW_API_URL=https://api2.jacochef.ru/site/public/index.php/cafe_review

            NEXT_PUBLIC_RECOMMENDATIONS_ENABLED=false

            NEXT_PUBLIC_SENTRY_CUSTOM_MONITORING_ENABLED=false

            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

            NEXT_PUBLIC_VK_IMG=https://mainimg.jacofood.ru/

            NEXT_PUBLIC_YANDEX_IMG=https://mainimg.jacofood.ru/

            NEXT_PUBLIC_YANDEX_STORAGE=https://topimg.jacofood.ru/

            NEXT_PUBLIC_YANDEX_TOKEN_FIREBASE=${{ secrets.NEXT_PUBLIC_YANDEX_TOKEN_FIREBASE }}

            NEXT_PUBLIC_YANDEX_TOKEN_MAP=${{ secrets.NEXT_PUBLIC_YANDEX_TOKEN_MAP }}

            NEXT_PUBLIC_YANDEX_TOKEN_SUGGEST=${{ secrets.NEXT_PUBLIC_YANDEX_TOKEN_SUGGEST }}

          cache-from: type=gha

          cache-to: type=gha,mode=max


  # =========================================================
  # DEPLOY
  # =========================================================

  deploy:

    name: Deploy dev.jacofood.ru

    needs:
      - build

    runs-on: ubuntu-latest

    if: ${{ vars.AUTO_DEPLOY_FRONTEND == 'true' }}

    steps:

      - name: Deploy frontend over SSH
        uses: appleboy/ssh-action@v1.2.0

        with:

          host: ${{ secrets.SERVER_HOST }}

          username: ${{ secrets.SERVER_USER }}

          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            set -e

            cd /opt/jaco/test-app-new

            echo "Deploy commit: ${{ github.sha }}"

            echo "IMAGE_TAG=${{ github.sha }}" > .env.deploy

            docker compose \
              --env-file .env.deploy \
              -f compose.prod.yml \
              pull

            docker compose \
              --env-file .env.deploy \
              -f compose.prod.yml \
              up -d \
              --remove-orphans

            echo "Waiting for frontend..."

            for i in $(seq 1 20); do

              if curl \
                --fail \
                --silent \
                http://127.0.0.1:3001/api/health
              then

                echo "Frontend is healthy"

                exit 0

              fi

              echo "Healthcheck attempt $i"

              sleep 3

            done

            echo "Frontend healthcheck failed"

            docker logs \
              --tail 100 \
              test-app-new-dev

            exit 1